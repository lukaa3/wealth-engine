name: Backtest (short-term setups)
# Manual: tests short-term setups (days–weeks) and the long-term "sell a third at a target" rule on ~10 years of daily data.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history"
        default: "10"
      set:
        description: "Setups: all, refined or manage"
        default: "all"
      mincap:
        description: "Min market cap"
        default: "3e8"
permissions:
  contents: write
concurrency:
  group: backtest-short
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run short-term backtest
        run: node scripts/backtest-short.mjs
        env:
          BT_YEARS: ${{ inputs.years }}
          BT_SET: ${{ inputs.set }}
          BT_MINCAP: ${{ inputs.mincap }}
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.set }}" = "refined" ]; then mv public/data/backtest-short.json public/data/backtest-short-refined.json; fi
          if [ "${{ inputs.set }}" = "manage" ]; then mv public/data/backtest-short.json public/data/backtest-manage.json; fi
          if [ "${{ inputs.set }}" = "chase" ]; then mv public/data/backtest-short.json public/data/backtest-chase.json; fi
          if [ "${{ inputs.set }}" = "rank" ]; then mv public/data/backtest-short.json public/data/backtest-rank.json; fi
          git add public/data/backtest-short*.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: short-term backtest results [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" && git push -q && exit 0; sleep 5; done
          exit 1
