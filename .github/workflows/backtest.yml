name: Backtest
# Manual: replays ~10 years of monthly picks with the site's chart-based score and saves public/data/backtest.json.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history"
        default: "10"
      top:
        description: "Stocks held each month"
        default: "20"
      universe:
        description: "sp500 (no hand-picked extras = less hindsight) or all"
        default: "sp500"
permissions:
  contents: write
concurrency:
  group: backtest
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run backtest
        run: node scripts/backtest.mjs
        env:
          BT_YEARS: ${{ inputs.years }}
          BT_TOP: ${{ inputs.top }}
          BT_UNIVERSE: ${{ inputs.universe }}
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: backtest results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q && exit 0; sleep 5; done
          exit 1
