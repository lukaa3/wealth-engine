# Builds the site, refreshes market data on a schedule, and deploys to GitHub Pages.
# Setup: Settings → Pages → Source: "GitHub Actions".
#        Settings → Secrets and variables → Actions → add the secrets/variables listed in README.md.
name: Update data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "45 21 * * 1-5"   # 21:45 UTC on weekdays ≈ after the US close (4:45 pm EST / 5:45 pm EDT)
  workflow_dispatch:

permissions:
  contents: write   # commit refreshed public/data/*.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # the full scan + ~400 deep checks take ~30-45 min
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The pool of fully checked stocks (cache/pool.json) and the API cache live in the Actions cache, not in git.
      - name: Restore data cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Refresh market data (scheduled / manual runs only)
        if: github.event_name != 'push'
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_MAX_STOCKS: ${{ vars.AI_MAX_STOCKS }}
        run: node scripts/update-screener.mjs

      # Claude (uses your Pro/Max subscription via CLAUDE_CODE_OAUTH_TOKEN). If it fails, free-tier/earlier takes stay.
      - name: Claude analyst takes
        if: github.event_name != 'push' && env.HAS_CLAUDE == 'true'
        continue-on-error: true
        timeout-minutes: 20
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--allowedTools Read,Write --max-turns 8"
          prompt: |
            Read .ai/brief.md. It has one section per stock (## TICKER) with the screener's data:
            the multi-factor score (momentum, earnings estimate trends, quality, valuation, smart money), risk level,
            best-fit horizon, the buy plan with its stop, and recent analyst headlines.

            For EVERY ticker in the brief, write a short note for a young investor holding from a few weeks to a few years,
            matching the stock's best-fit horizon. Weigh momentum and earnings-estimate trends most; the FVG is minor background.
            Never tell the reader to wait for a pullback, a dip or a better entry, and don't treat being stretched above the
            50-day average as a reason to hold off: in this site's 10-year backtests, buying picks at once (even stretched ones)
            beat waiting for lower prices. Don't list being stretched as a bear point unless it's 60%+ above the 50-day
            (the site shows its own note about bigger swings).
            Use ONLY the data in the brief. Do not add news, numbers or events that are not there. If data is missing, say so.
            Plain language, no hype, no guarantees, no telling anyone to buy or sell.

            Write the result to .ai/claude_takes.json as ONE JSON object keyed by ticker:
            {"NVDA": {"verdict": "Buy setup" | "Accumulate" | "Watch" | "Avoid",
                      "summary": "2 sentences on why the setup looks the way it does",
                      "bull": ["short point", "short point"],
                      "bear": ["short point", "short point"],
                      "watch": "one sentence naming the level or event to watch next",
                      "confidence": "low" | "medium" | "high"}, ...}
            Write only that file. Do not edit any other file.

      - name: Merge Claude takes
        if: github.event_name != 'push' && env.HAS_CLAUDE == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/merge-ai-takes.mjs

      - name: Save data cache
        if: always() && github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: data-cache-${{ github.run_id }}

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh screener data [skip ci]"
          # code may have been pushed while the job ran: rebase onto it and retry
          for i in 1 2 3; do git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" && git push -q && exit 0; sleep 5; done
          exit 1

      - name: Install & build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WATCHLIST: ${{ vars.WATCHLIST }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
